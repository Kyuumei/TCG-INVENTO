# Déploiement du jeu sur GitHub Pages.
#
# `enablement: true` active Pages tout seul à la première exécution : aucun
# réglage manuel n'est nécessaire. Une limite subsiste toutefois côté GitHub —
# Pages n'est disponible sur un dépôt **privé** qu'avec un plan payant. Sur un
# compte gratuit, il faut rendre le dépôt public pour que la mise en ligne
# aboutisse.
#
# Le jeu est publié à l'adresse https://<compte>.github.io/TCG-INVENTO/.
#
# Les illustrations sont versionnées dans public/art/ : le déploiement n'a donc
# pas à les régénérer, et le rendu publié est exactement celui qui a été relu.
name: Déployer sur GitHub Pages

on:
  push:
    branches: [main, claude/tcg-card-game-mobile-k7r25t]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule mise en ligne à la fois ; on ne coupe pas un déploiement en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire:
    name: Construire
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Tester le moteur de règles
        run: npm test

      - name: Construire
        run: npm run build

      - name: Activer et configurer Pages
        uses: actions/configure-pages@v5
        with:
          # Crée le site Pages s'il n'existe pas encore, plutôt que d'exiger
          # un passage préalable par les réglages du dépôt.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deployer:
    name: Mettre en ligne
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
