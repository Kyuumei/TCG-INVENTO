# Déploiement du jeu sur GitHub Pages.
#
# Deux conditions doivent être réunies côté GitHub, une seule fois :
#
#   1. le dépôt doit être **public** — Pages n'est servi depuis un dépôt privé
#      qu'avec un plan payant (Pro, Team, Enterprise) ;
#   2. dans Réglages → Pages, la source doit être réglée sur
#      « GitHub Actions ».
#
# Le second point ne peut pas être automatisé : le jeton fourni aux workflows
# a le droit de *déployer* sur Pages, pas de *créer* le site (l'option
# `enablement` de configure-pages échoue avec « Resource not accessible by
# integration »).
#
# Le jeu est ensuite publié à https://<compte>.github.io/TCG-INVENTO/.
#
# Les illustrations sont versionnées dans public/art/ : le déploiement n'a donc
# pas à les régénérer, et le rendu publié est exactement celui qui a été relu.
name: Déployer sur GitHub Pages

on:
  push:
    branches: [main, claude/tcg-card-game-mobile-k7r25t]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule mise en ligne à la fois ; on ne coupe pas un déploiement en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire:
    name: Construire
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Tester le moteur de règles
        run: npm test

      - name: Construire
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deployer:
    name: Mettre en ligne
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
